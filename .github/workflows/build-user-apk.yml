name: Build User App APK (Release)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Inject User App Environment Variable
        run: |
          echo "VITE_APP_TARGET=user" > .env
          echo "VITE_API_URL=https://jupiterfresh.co.in" >> .env

      - name: Build Web App
        run: npm run build

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Release APK and AAB
        working-directory: ./android
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease -Pandroid.injected.signing.store.file=${{ github.workspace }}/android/app/taja-release.keystore -Pandroid.injected.signing.store.password=tajacart2026 -Pandroid.injected.signing.key.alias=taja -Pandroid.injected.signing.key.password=tajacart2026

      - name: Upload User App APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JupiterFresh-UserApp-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload User App AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JupiterFresh-UserApp-Release-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
